# Polls Jira for tickets tagged with a specific label and runs /sprint-testing against each one
# via the Claude Code GitHub Action, on its own branch, opening a PR with the results.
#
# Required GitHub repo VARIABLES (Settings -> Secrets and variables -> Actions -> Variables):
#   JIRA_SITE    e.g. "yourcompany.atlassian.net" (no https://)
#   JIRA_LABEL   exact Jira label - every ticket tagged with it gets picked up, any status/project.
#
# Required GitHub repo SECRETS (Settings -> Secrets and variables -> Actions -> Secrets):
#   JIRA_EMAIL          the Atlassian account email paired with JIRA_TOKEN
#   JIRA_TOKEN          Jira API token (already added)
#   ANTHROPIC_API_KEY   Claude API key (platform.claude.com) - or use claude_code_oauth_token instead, see below
#
# Also required: the Claude GitHub App installed on this repo - https://github.com/apps/claude
# See .claude/skills/agentic-qa-core/references/jira-ci-trigger.md for what happens inside the job.
#
# The pull_request and push(main) triggers below are both scoped to changes that touch this
# workflow file (or its doc) - a fast way to smoke-test a change to the trigger itself against
# real Jira/CI on every push to an open PR, and again once that PR merges into main, without
# waiting for the 15-minute schedule. Both still do the real thing (poll Jira, can open a PR,
# comment on a real ticket) - it's not a dry run. Broaden the `paths:` filter (or drop it) on
# either if you want it to run on every PR/push instead of just ones editing this file.

name: Jira QA Trigger

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      ticket_key:
        description: "LEAVE BLANK to run the real JIRA_LABEL search. Only fill this in to test ONE issue by its Jira key (e.g. SCRUM-1) - NOT a label, NOT JIRA_LABEL's value."
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/jira-qa-trigger.yml"
      - ".claude/skills/agentic-qa-core/references/jira-ci-trigger.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/jira-qa-trigger.yml"
      - ".claude/skills/agentic-qa-core/references/jira-ci-trigger.md"

concurrency:
  group: jira-qa-trigger
  cancel-in-progress: false

jobs:
  find-tickets:
    runs-on: ubuntu-latest
    outputs:
      tickets: ${{ steps.find.outputs.tickets }}
      has_tickets: ${{ steps.find.outputs.has_tickets }}
    env:
      JIRA_SITE: ${{ vars.JIRA_SITE }}
      JIRA_LABEL: ${{ vars.JIRA_LABEL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      TICKET_KEY_OVERRIDE: ${{ github.event.inputs.ticket_key }}
    steps:
      - name: Query Jira for tickets ready for QA
        id: find
        run: |
          set -euo pipefail
          : "${JIRA_SITE:?Set the JIRA_SITE repo variable}"
          : "${JIRA_EMAIL:?Set the JIRA_EMAIL repo secret}"
          : "${JIRA_TOKEN:?Set the JIRA_TOKEN repo secret}"

          if [ -n "${TICKET_KEY_OVERRIDE:-}" ]; then
            if ! [[ "$TICKET_KEY_OVERRIDE" =~ ^[A-Za-z][A-Za-z0-9]*-[0-9]+$ ]]; then
              echo "::error::ticket_key '$TICKET_KEY_OVERRIDE' doesn't look like a Jira issue key (expected something like SCRUM-1). Leave ticket_key BLANK to run the real JIRA_LABEL search instead - it is not the place for JIRA_LABEL's value."
              exit 1
            fi
            JQL="key = \"${TICKET_KEY_OVERRIDE}\""
          else
            : "${JIRA_LABEL:?Set the JIRA_LABEL repo variable}"
            # A ticket matching labels = "$JIRA_LABEL" always has a non-empty labels field, so the
            # "!= excludes empty" JQL gotcha (see jira-ci-trigger.md) doesn't apply here - no need
            # for the "OR labels is EMPTY" workaround this query needed when it filtered by status.
            JQL="labels = \"${JIRA_LABEL}\" AND labels != \"ai-qa-picked-up\""
          fi

          BODY=$(jq -n --arg jql "$JQL" '{jql: $jql, maxResults: 25, fields: ["key","summary"]}')

          echo "JQL: $JQL"

          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -u "${JIRA_EMAIL}:${JIRA_TOKEN}" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            --data "$BODY" \
            "https://${JIRA_SITE}/rest/api/3/search/jql")

          echo "Jira responded HTTP $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Jira API call failed (HTTP $HTTP_STATUS) - check JIRA_SITE/JIRA_EMAIL/JIRA_TOKEN and that JIRA_LABEL is exactly right. Response body:"
            cat response.json
            exit 1
          fi

          if jq -e '.errorMessages or .errors' response.json > /dev/null 2>&1; then
            echo "::error::Jira returned 200 but with an error body (bad JQL - check JIRA_LABEL spelling/case):"
            cat response.json
            exit 1
          fi

          jq -c '[.issues[]? | {key: .key, summary: .fields.summary}]' response.json > tickets.json
          COUNT=$(jq 'length' tickets.json)
          echo "tickets=$(cat tickets.json)" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then echo "has_tickets=true" >> "$GITHUB_OUTPUT"; else echo "has_tickets=false" >> "$GITHUB_OUTPUT"; fi
          echo "Found $COUNT ticket(s) matching: $JQL"

      - name: Mark tickets as picked up + post a "testing started" comment
        if: steps.find.outputs.has_tickets == 'true'
        run: |
          set -euo pipefail
          jq -r '.[].key' tickets.json | while read -r KEY; do
            echo "Claiming $KEY"
            curl -sS -X PUT \
              -u "${JIRA_EMAIL}:${JIRA_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"update":{"labels":[{"add":"ai-qa-picked-up"}]}}' \
              "https://${JIRA_SITE}/rest/api/3/issue/${KEY}"

            curl -sS -X POST \
              -u "${JIRA_EMAIL}:${JIRA_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"body":{"type":"doc","version":1,"content":[{"type":"paragraph","content":[{"type":"text","text":"AI QA picked this up and started a sprint-testing pass. Results will follow as a comment here, with a pull request in the repo."}]}]}}' \
              "https://${JIRA_SITE}/rest/api/3/issue/${KEY}/comment"
          done

  run-sprint-testing:
    needs: find-tickets
    if: needs.find-tickets.outputs.has_tickets == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ticket: ${{ fromJson(needs.find-tickets.outputs.tickets) }}
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    env:
      JIRA_SITE: ${{ vars.JIRA_SITE }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run /sprint-testing for ${{ matrix.ticket.key }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # If you'd rather use a Claude subscription instead of API billing, replace the line
          # above with: claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /sprint-testing

            Jira ticket ${{ matrix.ticket.key }}: "${{ matrix.ticket.summary }}"

            This ticket is tagged for AI QA testing. Run the sprint-testing plan -> execute -> report
            phases against it. File the ATR and any bug notes under docs/ exactly as
            .claude/skills/qa-obsidian-notes/SKILL.md describes.

            Then follow .claude/skills/agentic-qa-core/references/jira-ci-trigger.md for how to
            open a pull request with what you found and how to comment the result back on
            ticket ${{ matrix.ticket.key }} in Jira.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash,Grep,Glob"
            --max-turns 30
